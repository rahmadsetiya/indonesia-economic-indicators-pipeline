services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indicators
      POSTGRES_USER: indicators
      POSTGRES_PASSWORD: indicators
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indicators -d indicators"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
