[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesia-economic-indicators"
version = "0.1.0"
description = "Provenance-aware pipeline for Indonesian official macroeconomic indicators"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project contributors"}]
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
iei = "indonesia_economic_indicators.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
